name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or the calls that trigger it.
      render: java
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Stack trace or logs
      description: Remove tokens and other secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: e.g. 19.6.0
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: GitLab product
      options:
        - GitLab.com
        - GitLab Dedicated
        - GitLab self-managed
    validations:
      required: true
  - type: input
    id: self-managed-version
    attributes:
      label: GitLab self-managed version
      description: Only if you use a self-managed instance.
      placeholder: e.g. 19.6
  - type: input
    id: java
    attributes:
      label: Java version and OS
      placeholder: e.g. Temurin 21, Ubuntu 24.04
