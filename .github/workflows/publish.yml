name: Publish to Maven Central

# Run by hand with the tag the Release workflow created (such as v2026.3.10.0). The steps live in common-parent so that
# every repository publishes the same way.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v2026.3.10.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-publish.yml@736dd7d218d81bcc26e0489f8853b711ad95f26d # v17
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
